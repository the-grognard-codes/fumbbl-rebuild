name: Deploy Firebase Hosting (PROD)

on:
  push:
    tags:
      - moles-v*
      - '!moles-v0-wif-check-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing moles-v* tag to deploy
        type: string
      verify_only:
        description: Verify PROD service-account impersonation from a protected WIF check tag
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-prod
  cancel-in-progress: false

jobs:
  verify-identity:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_only
    needs: [release]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Verify PROD service-account impersonation
        uses: google-github-actions/auth@v3
        with:
          project_id: molesunderthepitch-dotorg
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    env:
      VERIFY_ONLY: ${{ inputs.verify_only }}
      DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_TAG: ${{ inputs.verify_only && github.ref_name || inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate the selected tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^moles-v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "release_tag must be a moles-v* tag" >&2
            exit 1
          fi
          if [[ "$VERIFY_ONLY" == true ]]; then
            if [[ "$GITHUB_REF" != refs/tags/moles-v0-wif-check-?* ]]; then
              echo 'Dispatch verification from a protected moles-v0-wif-check-* tag.' >&2
              exit 1
            fi
          elif [[ "$RELEASE_TAG" == moles-v0-wif-check-* ]]; then
            echo 'WIF check tags are reserved for impersonation verification.' >&2
            exit 1
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -z "$DISPATCH_RELEASE_TAG" ]]; then
            echo 'Specify release_tag for a production deployment.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify immutable release reference originates from main
        id: release
        shell: bash
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG" > /dev/null
          release_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_commit" origin/main
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

  browser-validation:
    if: ${{ !inputs.verify_only }}
    needs: [release]
    permissions:
      contents: read
    uses: ./.github/workflows/browser-validation.yml
    with:
      commit: ${{ needs.release.outputs.commit }}

  deploy:
    if: ${{ !inputs.verify_only }}
    needs: [release, browser-validation]
    runs-on: ubuntu-24.04
    environment: production
    env:
      # Prefer environment variables. The secrets fallback avoids silently dropping
      # existing repository configuration while these public identifiers are moved.
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
      - name: Verify checkout matches the browser-validated release commit
        env:
          DEPLOY_COMMIT: ${{ needs.release.outputs.commit }}
        shell: bash
        run: '[[ "$(git rev-parse HEAD)" == "$DEPLOY_COMMIT" ]]'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: browser-client/package-lock.json
      - run: npm ci --prefix browser-client
      - name: Validate Google Cloud deployment configuration
        shell: bash
        run: |
          if [[ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ]]; then
            echo "::error title=Missing Workload Identity provider::Set GCP_WORKLOAD_IDENTITY_PROVIDER as a production environment variable."
            exit 1
          fi
          if [[ ! "$GCP_WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]; then
            echo "::error title=Invalid Workload Identity provider::GCP_WORKLOAD_IDENTITY_PROVIDER must be the full projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider> resource name."
            exit 1
          fi
          if [[ -z "$GCP_DEPLOY_SERVICE_ACCOUNT" ]]; then
            echo "::error title=Missing deploy service account::Set GCP_DEPLOY_SERVICE_ACCOUNT as a production environment variable."
            exit 1
          fi
      - name: Authenticate to Google Cloud through OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: molesunderthepitch-dotorg
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - run: npm run assemble --prefix deployment/firebase -- --environment prod
      - run: npm run verify-hosting-artifact --prefix deployment/firebase -- --environment prod
      - name: Deploy the tagged PROD Hosting artifact
        run: >-
          npx --yes firebase-tools@latest deploy --only hosting --config firebase.generated.json
          --project molesunderthepitch-dotorg --non-interactive
          --message "${{ needs.release.outputs.tag }} ${{ needs.release.outputs.commit }}"
      - name: Record release identity
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
        shell: bash
        run: |
          {
            echo "## Production Hosting deployment"
            echo
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- Firebase project: \`molesunderthepitch-dotorg\`"
          } >> "$GITHUB_STEP_SUMMARY"
