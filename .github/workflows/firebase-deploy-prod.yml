name: Deploy Firebase Hosting (PROD)

on:
  push:
    tags:
      - moles-v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing moles-v* tag to deploy
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      # Prefer environment variables. The secrets fallback avoids silently dropping
      # existing repository configuration while these public identifiers are moved.
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
      - name: Verify immutable release reference originates from main
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^moles-v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "release_tag must be a moles-v* tag" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG" > /dev/null
          release_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_commit" origin/main
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: browser-client/package-lock.json
      - run: npm ci --prefix browser-client
      - name: Validate Google Cloud deployment configuration
        shell: bash
        run: |
          if [[ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ]]; then
            echo "::error title=Missing Workload Identity provider::Set GCP_WORKLOAD_IDENTITY_PROVIDER as a production environment variable."
            exit 1
          fi
          if [[ ! "$GCP_WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]; then
            echo "::error title=Invalid Workload Identity provider::GCP_WORKLOAD_IDENTITY_PROVIDER must be the full projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider> resource name."
            exit 1
          fi
          if [[ -z "$GCP_DEPLOY_SERVICE_ACCOUNT" ]]; then
            echo "::error title=Missing deploy service account::Set GCP_DEPLOY_SERVICE_ACCOUNT as a production environment variable."
            exit 1
          fi
      - name: Authenticate to Google Cloud through OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: molesunderthepitch-dotorg
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - run: npm run assemble --prefix deployment/firebase -- --environment prod
      - name: Deploy the tagged PROD Hosting artifact
        run: >-
          npx --yes firebase-tools@latest deploy --only hosting --config firebase.generated.json
          --project molesunderthepitch-dotorg --non-interactive
          --message "${{ steps.release.outputs.tag }} ${{ steps.release.outputs.commit }}"
      - name: Record release identity
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          {
            echo "## Production Hosting deployment"
            echo
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- Firebase project: \`molesunderthepitch-dotorg\`"
          } >> "$GITHUB_STEP_SUMMARY"
