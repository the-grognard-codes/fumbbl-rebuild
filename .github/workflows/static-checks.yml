name: Static delivery checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-delivery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: browser-client/package-lock.json
      - run: npm ci --prefix browser-client
      - run: npm test --prefix browser-client
      - run: npm run check --prefix site
      - run: npm run verify-environment --prefix deployment/firebase
      - run: npm run assemble --prefix deployment/firebase -- --environment dev --allow-placeholder-config
      - run: test -f deployment/firebase/hosting/index.html
      - run: test -f deployment/firebase/hosting/play/index.html
      - run: test -f deployment/firebase/hosting/login/complete/index.html
      - run: test -f deployment/firebase/hosting/firebase-web-config.js
