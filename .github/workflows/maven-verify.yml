name: Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_browser_validation:
        description: Also run the full browser suite on GitHub for diagnosis
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maven-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.full_browser_validation
    uses: ./.github/workflows/browser-validation.yml
    with:
      commit: ${{ github.sha }}

  local-review-tools:
    name: Local review lifecycle and computer player
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: node --test tools/test/dev-local.test.mjs tools/test/review-mount-source.test.mjs tools/test/match-review-start.test.mjs tools/test/review-current-matches-index.test.mjs tools/test/game-service-start.test.mjs
      - run: node --test tools/test/validation.test.mjs tools/test/browser-local.test.mjs tools/test/deploy.test.mjs
      - run: npm test --prefix computer-player

  baseline:
    # Keep the established required-check context used by PR branch protection.
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: 56c19c80070861e89f465f1989be403d3aad0ffd

      - name: Read baseline Java version
        id: toolchain
        shell: pwsh
        run: |
          $toolchain = Get-Content tools/build-toolchain.json -Raw | ConvertFrom-Json
          "java-version=$($toolchain.java.ciVersion)" >> $env:GITHUB_OUTPUT

      - name: Set up baseline Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - name: Set up project-local Maven
        shell: pwsh
        run: ./tools/bootstrap.ps1 -JavaHome $env:JAVA_HOME

      - name: Cache project-local Maven repository
        uses: actions/cache@v4
        with:
          path: .tools/repository
          key: ${{ runner.os }}-m0a-${{ hashFiles('tools/build-toolchain.json', '**/pom.xml', '**/repo/**') }}

      - name: Check build tooling
        shell: pwsh
        run: ./tools/test-tooling.ps1

      - name: Reject disabled tests
        shell: pwsh
        run: |
          $disabledTests = Get-ChildItem -Path . -Recurse -File -Filter '*.java' |
            Select-String -Pattern '@Disabled\b|@Ignore\b'
          if ($disabledTests) {
            Write-Error "Disabled tests are not allowed in the validation suite:`n$disabledTests"
            exit 1
          }

      - name: Run Maven verify
        shell: pwsh
        run: ./tools/build.ps1 verify

  target-shards:
    name: Java 21 state tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read target Java version
        id: toolchain
        shell: pwsh
        run: |
          $toolchain = Get-Content tools/target-build-toolchain.json -Raw | ConvertFrom-Json
          "java-version=$($toolchain.java.ciVersion)" >> $env:GITHUB_OUTPUT

      - name: Set up baseline Java 8 for Maven bootstrap
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8.0.504+1

      - name: Set up project-local Maven
        shell: pwsh
        run: ./tools/bootstrap.ps1 -JavaHome $env:JAVA_HOME

      - name: Set up target Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - name: Cache project-local Maven repository
        uses: actions/cache@v4
        with:
          path: .tools/repository
          key: ${{ runner.os }}-r1-java21-${{ hashFiles('tools/build-toolchain.json', 'tools/target-build-toolchain.json', '**/pom.xml', '**/repo/**') }}

      - name: Reject disabled target tests
        shell: pwsh
        run: |
          $disabledTests = Get-ChildItem -Path . -Recurse -File -Filter '*.java' |
            Select-String -Pattern '@Disabled\b|@Ignore\b'
          if ($disabledTests) {
            Write-Error "Disabled tests are not allowed in the validation suite:`n$disabledTests"
            exit 1
          }

      - name: Check native validation tooling
        shell: pwsh
        run: ./tools/validation/test-native-shard.ps1

      - name: Run target Maven verify with isolated state-test shard
        shell: pwsh
        run: ./tools/validation/native-shard.ps1 -Shard ${{ matrix.shard }} -JavaHome $env:JAVA_HOME

      - name: Upload native execution timings
        uses: actions/upload-artifact@v4
        with:
          name: java-native-${{ matrix.shard }}
          overwrite: true
          path: .tools/validation/native-${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  target:
    # Preserve the established required-check context; all matrix children must pass.
    name: Java 21 target verification
    needs: [target-shards]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: java-native-*
          path: .tools/validation-reports
          merge-multiple: true
      - name: Require successful jobs and complete native execution
        env:
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
        run: node tools/validation/coverage-gate.mjs native .tools/validation-reports

  static-checks:
    name: Static assets, unit tests and Hosting artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: browser-client/package-lock.json
      - run: npm ci --prefix browser-client
      - run: npm run assets:check --prefix browser-client
      - run: npm test --prefix browser-client
      - run: npm run check --prefix site
      - run: npm test --prefix site
      - run: npm run verify-environment --prefix deployment/firebase
      - run: npm run assemble --prefix deployment/firebase -- --environment dev
      - run: npm run verify-hosting-artifact --prefix deployment/firebase -- --environment dev
      - run: npm run assemble --prefix deployment/firebase -- --environment prod
      - run: npm run verify-hosting-artifact --prefix deployment/firebase -- --environment prod

  static-delivery:
    # Keep the check name; browser execution is local for DEV and mandatory in PROD.
    name: Static delivery
    needs: [static-checks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require complete fast checks and registered browser inventory
        env:
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
        run: node tools/validation/static-gate.mjs

  game-session:
    name: Firebase game session service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f game-service/pom.xml clean verify
      - run: bash -n deployment/game-service/provision.sh
      - run: bash -n deployment/game-service/activate.sh
      - run: bash -n deployment/game-service/install-host.sh
