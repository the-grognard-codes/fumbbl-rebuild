# Local diagnostic transport only. Not a DEV/PROD TLS configuration.
worker_processes 1;
pid logs/nginx.pid;
error_log /dev/null;
events { worker_connections 512; }
http {
    server_tokens off;
    log_format safe '$status $bytes_sent $request_time';
    access_log logs/access.log safe;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    map $http_origin $local_origin_allowed {
        default 0;
        "http://localhost:5000" 1;
        "http://127.0.0.1:5000" 1;
        "http://localhost:5173" 1;
        "http://127.0.0.1:5173" 1;
    }
    server {
        listen 127.0.0.1:22232 default_server;
        server_name 127.0.0.1;
        if ($http_host != "127.0.0.1:22232") { return 403; }
        location = /browser/v2 {
            if ($request_uri != /browser/v2) { return 403; }
            if ($request_method != GET) { return 403; }
            if ($local_origin_allowed = 0) { return 403; }
            if ($http_upgrade != websocket) { return 403; }
            if ($http_authorization != '') { return 403; }
            if ($http_cookie != '') { return 403; }
            proxy_pass http://127.0.0.1:22231;
            proxy_http_version 1.1;
            proxy_set_header Host "127.0.0.1:22231";
            proxy_set_header Origin $http_origin;
            proxy_set_header Upgrade websocket;
            proxy_set_header Connection upgrade;
            proxy_set_header Forwarded '';
            proxy_set_header X-Forwarded-For '';
            proxy_set_header X-Forwarded-Host '';
            proxy_set_header X-Forwarded-Proto '';
            proxy_set_header X-Real-IP '';
            proxy_set_header Authorization '';
            proxy_set_header Cookie '';
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 360s;
            proxy_send_timeout 30s;
            proxy_next_upstream off;
        }
        location / { return 404; }
    }
}
