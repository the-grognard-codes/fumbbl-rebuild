# Standalone candidate: deliberately LOOPBACK ONLY until a reviewed host rollout.
# Start with an isolated nginx prefix containing tls/fullchain.pem, tls/privkey.pem,
# and logs/. Do not include this inside an existing http {} block.
worker_processes 1;
pid logs/nginx.pid;
# Request-related nginx errors can contain raw URLs. Disable them here; never debug-log credentials.
error_log /dev/null;
events { worker_connections 512; }
http {
    server_names_hash_bucket_size 64;
    server_tokens off;
    log_format safe '$status $bytes_sent $request_time';
    access_log logs/access.log safe;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:game_tls:1m;
    ssl_session_tickets off;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;

    server {
        listen 127.0.0.1:24443 ssl default_server;
        ssl_reject_handshake on;
        return 403;
    }
    server {
        listen 127.0.0.1:24443 ssl;
        server_name game-dev.molesunderthepitch.org;
        ssl_certificate tls/fullchain.pem;
        ssl_certificate_key tls/privkey.pem;

        # Exact SNI and Host; neither forwarded headers nor normalization select a profile.
        if ($ssl_server_name != game-dev.molesunderthepitch.org) { return 403; }
        if ($http_host != game-dev.molesunderthepitch.org) { return 403; }

        location = /browser/v2 {
            # $request_uri retains escaping and an empty query delimiter.
            if ($request_uri != /browser/v2) { return 403; }
            if ($request_method != GET) { return 403; }
            if ($http_origin != https://dev.molesunderthepitch.org) { return 403; }
            if ($http_upgrade != websocket) { return 403; }
            # The sole credential carrier is the authenticated JSON protocol frame.
            if ($http_authorization != '') { return 403; }
            if ($http_cookie != '') { return 403; }

            proxy_pass http://127.0.0.1:22231;
            proxy_http_version 1.1;
            proxy_set_header Host game-dev.molesunderthepitch.org;
            proxy_set_header Origin $http_origin;
            proxy_set_header Upgrade websocket;
            proxy_set_header Connection upgrade;
            proxy_set_header Forwarded '';
            proxy_set_header X-Forwarded-For '';
            proxy_set_header X-Forwarded-Host '';
            proxy_set_header X-Forwarded-Proto '';
            proxy_set_header X-Real-IP '';
            proxy_set_header Authorization '';
            proxy_set_header Cookie '';
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            # Longer than Jetty's existing five-minute idle policy; no policy extension.
            proxy_read_timeout 360s;
            proxy_send_timeout 30s;
            proxy_next_upstream off;
        }
        location / { return 404; }
    }
}
