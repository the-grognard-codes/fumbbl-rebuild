# Retained format-1 trial: never rebuild or recreate its unfinished match runtime.
# Do not combine with compose.yaml or override the project name.
name: ffb-local-r2
services:
  database:
    image: mariadb:11.8.9@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
    environment:
      MARIADB_DATABASE: ffb_local
      MARIADB_USER: ffb_local
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [isolated]
  server:
    image: ffb-server:3.4.0-r2.1
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:22229:22227"
    secrets: [db_password, browser_home_token, browser_away_token]
    volumes:
      - ./server.ini:/config/server.ini:ro
      - backup:/data/backup
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD-SHELL, "test \"$$(curl -sS -o /dev/null -w '%{http_code}' -H 'Origin: http://localhost:5173' http://127.0.0.1:22227/browser/v1)\" = 405"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [isolated, loopback]
networks:
  isolated:
    internal: true
  loopback:
volumes:
  database:
  backup:
secrets:
  db_password:
    file: ./.secrets/db_password
  db_root_password:
    file: ./.secrets/db_root_password
  browser_home_token:
    file: ./.secrets/browser_home_token
  browser_away_token:
    file: ./.secrets/browser_away_token
