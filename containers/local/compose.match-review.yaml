# Isolated current-source review stack. The retained ffb-current-dev volumes are never mounted.
name: ffb-match-review
services:
  database:
    image: mariadb:11.8.9@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
    command: ["--max-allowed-packet=64M"]
    environment:
      MARIADB_DATABASE: ffb_local
      MARIADB_USER: ffb_m6_runtime
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    ports: ["127.0.0.1:23317:3306"]
    volumes: [database:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [loopback]
  server:
    image: ffb-server:match-review
    restart: "on-failure:3"
    build:
      context: ../..
      dockerfile: containers/local/Dockerfile
      args:
        MAVEN_FLAGS: "${DEV_LOCAL_MAVEN_FLAGS:-}"
    depends_on:
      database:
        condition: service_healthy
    ports: ["127.0.0.1:22234:22227"]
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/adc/application_default_credentials.json
      JAVA_TOOL_OPTIONS: "-Dffb.browser.timing=${DEV_LOCAL_GAMEPLAY_TIMING:-false}"
      FFB_HEAP_DUMP_ROOT: /data/heap-dumps
    extra_hosts: ["host.docker.internal:host-gateway"]
    secrets: [db_password]
    volumes:
      - ./server.match-review.ini:/config/server.ini:ro
      - ${M6_ADC_FILE:?Set M6_ADC_FILE to the existing local ADC file}:/run/adc/application_default_credentials.json:ro
      - backup:/data/backup
      - ${DEV_LOCAL_HEAP_DUMP_DIR:-../../.tools/dev-local/heap-dumps}:/data/heap-dumps
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --output, /dev/null, "http://127.0.0.1:22227/health/engine"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
    networks: [loopback]
  schema-bootstrap:
    image: ffb-server:match-review
    profiles: [bootstrap]
    depends_on:
      database:
        condition: service_healthy
    entrypoint: ["java", "-cp", "FantasyFootballServer.jar:lib/*", "com.fumbbl.ffb.server.local.LocalAcceptanceBootstrap", "/config/server.ini"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    secrets: [db_password]
    volumes:
      - ./server.match-review.ini:/config/server.ini:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [loopback]
networks:
  loopback:
volumes:
  database:
  backup:
secrets:
  db_password:
    file: ${M6_DB_PASSWORD_FILE:?Set M6_DB_PASSWORD_FILE to the existing local secret file}
  db_root_password:
    file: ${M6_DB_ROOT_PASSWORD_FILE:?Set M6_DB_ROOT_PASSWORD_FILE to the existing local secret file}
