server.local=true
server.port=22227
server.base=http://127.0.0.1:22231
server.base.dir=htdocs
server.log.folder=/tmp/ffb-logs
server.log.file=/tmp/ffb-server.log
server.log.file.split=false
server.log.level=3
server.command.compression=false
server.test=false

# This URL/user pair is the only accepted marker-6 local target profile.
db.driver=org.mariadb.jdbc.Driver
db.url=jdbc:mariadb://host.docker.internal:23316/ffb_local
db.type=mariadb
db.user=ffb_m6_runtime
db.password.file=/run/secrets/db_password

admin.salt=local-fixture-only
admin.password.file=/run/secrets/admin_password
local.coach.password.file=/run/secrets/coach_password
backup.dir=/data/backup
backup.extension=gz
backup.salt=local-fixture-only
timer.networkEntropy=0
timer.sessionTimeoutEnabled=false

local.browser.v2.enabled=true
local.browser.v2.firebase.project=dev-moles-under-the-pitch-org
