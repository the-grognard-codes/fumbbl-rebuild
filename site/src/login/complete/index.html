<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign-in completion · Moles Under the Pitch</title>
  <link rel="stylesheet" href="/assets/site.css?v=20261008-6">
  <link rel="stylesheet" href="/assets/login.css">
</head>
<body>
  <!-- site-header -->
  <main class="reading auth-page sign-in-page">
    <h1 id="completion-heading">Finish signing in</h1>
    <section class="panel auth-panel" aria-labelledby="completion-heading">
      <p id="completion-message" role="status" aria-live="polite" aria-atomic="true">Checking your email link…</p>
      <form id="completion-form" hidden>
        <label for="completion-email">Email address</label>
        <input id="completion-email" type="email" autocomplete="email" inputmode="email" required>
        <button class="button" id="completion-submit" type="submit" disabled>Complete sign-in</button>
      </form>
      <noscript><p>Enable JavaScript in your browser to complete sign-in.</p></noscript>
      <p><a href="/login">Request another sign-in link</a></p>
      <p class="auth-help"><a href="/support#sign-in-help">Help signing in</a></p>
    </section>
  </main>
  <script src="/firebase-web-config.js"></script><script type="module" src="/assets/complete.js"></script>
  <footer><span>© 2026 Moles Under the Pitch</span><a href="/support">Support</a></footer>
  <script type="module" src="/assets/account-menu.js"></script>
</body>
</html>
