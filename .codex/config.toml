# Project settings merge user-level toolchain permissions when available.
default_permissions = "fumbbl-project"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

# Keep this parent defined so fresh machines can resolve the project profile.
# Machine-specific filesystem grants remain in the user's config.toml.
[permissions.cross-project-toolchains]
extends = ":workspace"

[permissions.fumbbl-project]
description = "MUTP workspace edits, builds, GitHub access, and deployment with writable Git metadata and build caches."
extends = "cross-project-toolchains"

[permissions.fumbbl-project.filesystem]
# Linked worktrees also write their shared Git directory in the main checkout.
'C:\Users\jaken\Git-Hub\fumbbl-rebuild\.git' = "write"
'C:\Users\jaken\AppData\Local\npm-cache' = "write"
'C:\Users\jaken\AppData\Local\ms-playwright' = "write"

[permissions.fumbbl-project.filesystem.":workspace_roots"]
".git" = "write"

[permissions.fumbbl-project.network]
enabled = true
