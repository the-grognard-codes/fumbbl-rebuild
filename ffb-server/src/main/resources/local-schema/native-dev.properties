# Exact native DEV contract; changing values requires a reviewed profile revision.
runtime.profile=marker6-dev-native
server.local=true
server.port=22231
server.base=http://127.0.0.1:22231
server.base.dir=/opt/moles-game-v2-dev/htdocs
server.log.folder=/var/log/moles-game-v2-dev
server.log.file=/var/log/moles-game-v2-dev/server.log
server.log.file.split=false
server.log.level=3
server.command.compression=false
server.test=false
db.driver=org.mariadb.jdbc.Driver
db.url=jdbc:mariadb://127.0.0.1:3306/ffb_m6_dev
db.type=mariadb
db.user=ffb_m6_runtime
db.password.file=/etc/moles-game-v2-dev/secrets/db_password
admin.salt=local-fixture-only
admin.password.file=/etc/moles-game-v2-dev/secrets/admin_password
local.coach.password.file=/etc/moles-game-v2-dev/secrets/coach_password
backup.dir=/var/lib/moles-game-v2-dev/backup
backup.extension=gz
backup.salt=local-fixture-only
timer.networkEntropy=0
timer.sessionTimeoutEnabled=false
local.browser.v2.enabled=true
local.transport.container.forwarding=false
local.browser.v2.proxy.profile=dev
local.browser.v2.firebase.project=dev-moles-under-the-pitch-org
