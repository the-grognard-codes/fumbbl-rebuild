# Browser V2 template. Prefer the verified local/native environment launchers.
# Provision a browser schema at marker 9 before starting; startup never resets it.
server.port=22234
server.base=http://127.0.0.1:22234
server.log.file=logs/browser-server.log
server.log.folder=logs
server.log.file.split=false
server.log.level=2
server.test=false
local.browser.v2.firebase.project=dev-moles-under-the-pitch-org

db.driver=org.mariadb.jdbc.Driver
db.url=jdbc:mariadb://127.0.0.1:23317/ffb_local?connectTimeout=500&socketTimeout=1500&sessionVariables=innodb_lock_wait_timeout=1
db.user=ffb_m6_runtime
# Supply db.password through the supported secret-file launcher or an ignored override.
