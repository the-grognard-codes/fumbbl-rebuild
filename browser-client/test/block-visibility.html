<head>

  <style>
    html,body{margin:0;background:#101c2b;color:#eee}
    .block-review-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;background:#14283a;position:relative;z-index:100}

    .block-review-pitch .live-camera-controls{position:relative;top:auto;left:auto;transform:none;display:flex;flex-wrap:wrap}
    .block-review-game{position:relative;height:calc(100dvh - 80px)}
